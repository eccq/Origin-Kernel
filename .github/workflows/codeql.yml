name: code scanning

on:
  workflow_dispatch:
  push:
    branches: [vanilla-bakasu]
  pull_request:
    branches: [vanilla-bakasu]
  schedule:
    - cron: "15 5 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: scan c-cpp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
